<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Agents Chat</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --panel: #fffdf8;
      --ink: #1f1a14;
      --muted: #6b6358;
      --line: #ddd4c6;
      --you: #2f5d50;
      --agent: #8a4b2c;
      --system: #4a5560;
      --end: #1d4e89;
      --warn: #9a3412;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, #efe6d8 0%, transparent 45%),
        linear-gradient(180deg, #f7f4ee, var(--bg));
      color: var(--ink);
      min-height: 100vh;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .status.connected { color: var(--you); border-color: #b7d5cb; }
    .status.waiting { color: var(--warn); border-color: #f0c7b0; }

    #log {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 420px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 14px;
      margin-bottom: 14px;
    }

    .bubble {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble .who {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .bubble.you { border-left: 4px solid var(--you); }
    .bubble.you .who { color: var(--you); }

    .bubble.agent { border-left: 4px solid var(--agent); }
    .bubble.agent .who { color: var(--agent); }

    .bubble.system { border-left: 4px solid var(--system); }
    .bubble.system .who { color: var(--system); }

    .bubble.end {
      border-left: 4px solid var(--end);
      background: #eef5ff;
    }
    .bubble.end .who { color: var(--end); }

    .bubble.tool_call {
      border-left: 4px solid #5b6b8c;
      background: #f4f6fa;
    }
    .bubble.tool_call .who { color: #5b6b8c; }

    .bubble.tool_result {
      border-left: 4px solid #2f5d50;
      background: #f3faf6;
    }
    .bubble.tool_result .who { color: #2f5d50; }

    .bubble .body {
      line-height: 1.45;
    }

    .bubble .body strong {
      font-weight: 700;
    }

    .bubble .body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 10px 0;
    }

    .composer {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: #fff;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--you);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Food Agents</h1>
    <p class="subtitle">
      Watch PreferenceParser → FoodSearcher → Recommender → HumanReviewer
    </p>

    <div id="status" class="status">Connecting...</div>
    <div id="log"></div>

    <div class="composer">
      <input
        id="message"
        type="text"
        placeholder="Example: spicy, 30g protein, under 500 calories"
        autocomplete="off"
      />
      <button id="sendBtn" type="button">Send</button>
    </div>
    <p class="hint" id="hint">
      First message starts the agents. When asked, reply with APPROVE or a food-related change.
    </p>
  </main>

  <script>
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const hintEl = document.getElementById("hint");

    let socket = null;
    let waitingForHuman = false;
    let runStarted = false;

    function setStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = "status" + (className ? " " + className : "");
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Small markdown-ish formatter for Recommender text (**bold**, ---, bullets)
    function formatContent(text) {
      let html = escapeHtml(text || "");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/^---$/gm, "<hr>");
      html = html.replace(/^- (.+)$/gm, "• $1");
      html = html.replace(/\n/g, "<br>");
      return html;
    }

    function addBubble(source, content, kind) {
      const div = document.createElement("div");
      div.className = "bubble " + (kind || "agent");

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = source || "unknown";

      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = formatContent(content || "");

      div.appendChild(who);
      div.appendChild(body);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function bubbleKind(source, type) {
      if (type === "end") return "end";
      if (type === "input_required") return "input_required";
      if (type === "tool_call") return "tool_call";
      if (type === "tool_result") return "tool_result";
      if (type === "error" || type === "status") return "system";
      if (source === "You") return "you";
      if (source === "System") return "system";
      return "agent";
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(protocol + "://" + location.host + "/ws/agents");

      socket.onopen = function () {
        setStatus("Connected", "connected");
      };

      socket.onclose = function () {
        setStatus("Disconnected — refresh the page", "");
        waitingForHuman = false;
      };

      socket.onerror = function () {
        setStatus("WebSocket error", "");
      };

      socket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        const type = data.type || "message";
        const source = data.source || "System";
        const content = data.content || "";

        addBubble(source, content, bubbleKind(source, type));

        if (type === "input_required") {
          waitingForHuman = true;
          setStatus("Waiting for your reply", "waiting");
          hintEl.textContent = "Type APPROVE or a food-related change, then Send.";
          inputEl.focus();
        }

        if (type === "end") {
          waitingForHuman = false;
          runStarted = false;
          setStatus("Connected — run finished", "connected");
          hintEl.textContent = "Send a new food request to start again.";
        }

        if (type === "error") {
          waitingForHuman = false;
          setStatus("Connected — error occurred", "connected");
        }
      };
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

      if (waitingForHuman) {
        socket.send(JSON.stringify({ type: "human_reply", text: text }));
        waitingForHuman = false;
        setStatus("Connected — agents continuing", "connected");
      } else {
        socket.send(JSON.stringify({ type: "start", text: text }));
        runStarted = true;
        setStatus("Connected — agents running", "connected");
      }

      inputEl.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    connect();
  </script>
</body>
</html>
